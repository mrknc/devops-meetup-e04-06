on:
 push:
   branches: [main]

permissions:
 contents: read
 packages: write

jobs:
 deploy:
   runs-on: team-01
   steps:
     - uses: azure/setup-helm@v4
     - uses: actions/checkout@v7
     - run: |
         IMG=ghcr.io/${GITHUB_REPOSITORY,,}/front
         echo ${{ github.token }} | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
         docker build -t "$IMG:$GITHUB_SHA" front
         docker push "$IMG:$GITHUB_SHA"
         helm upgrade --install --create-namespace \
           front front/chart \
           -n front \
           --set image.repository="$IMG" \
           --set image.tag="$GITHUB_SHA"
